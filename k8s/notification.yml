apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: cake-notification-service:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3004"
            - name: DATABASE_URL
              value: "mysql://root:password@mysql:3306/notification_db"
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq"
          ports:
            - containerPort: 3004
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - port: 3004
      targetPort: 3004
  
