apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: cake-order-service:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              value: "mysql://root:password@mysql:3306/order_db"
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq"
          ports:
            - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 3002
      targetPort: 3002
  
