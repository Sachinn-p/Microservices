apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rating-service
  template:
    metadata:
      labels:
        app: rating-service
    spec:
      containers:
        - name: rating-service
          image: cake-rating-service:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3003"
            - name: DATABASE_URL
              value: "mysql://root:password@mysql:3306/rating_db"
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq"
          ports:
            - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: rating-service
spec:
  selector:
    app: rating-service
  ports:
    - port: 3003
      targetPort: 3003
  
