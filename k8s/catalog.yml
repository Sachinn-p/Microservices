apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: cake-catalog-service:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              value: "mysql://root:password@mysql:3306/catalog_db"
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  selector:
    app: catalog-service
  ports:
    - port: 3001
      targetPort: 3001
  
