apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: cake-api-gateway:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3000"
            - name: CATALOG_URL
              value: "http://catalog-service:3001"
            - name: ORDER_URL
              value: "http://order-service:3002"
            - name: RATING_URL
              value: "http://rating-service:3003"
            - name: NOTIFICATION_URL
              value: "http://notification-service:3004"
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: NodePort
